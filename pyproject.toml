[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-qa-agent"
version = "1.0.0"
description = "AI-powered Invoice and Purchase Order comparison system"
requires-python = ">=3.8"
dependencies = [
    "streamlit>=1.28.1",
    "streamlit-option-menu>=0.3.12",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "openai>=1.6.1",
    "pandas>=2.1.4",
    "numpy>=1.24.0",
    "openpyxl>=3.1.2",
    "pypdf2>=3.0.1",
    "pdfplumber>=0.10.3",
    "python-docx>=1.1.0",
    "reportlab>=4.0.7",
    "Pillow>=10.1.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",
]

